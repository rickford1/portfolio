<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Repurposed 3D Printer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fa;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2rem;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
    }

    img {
      max-width: 100%;
      height: auto;
      margin-top: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Repurposed 3D Printer</h1>
    <p>This is my first project. Below is an image of it:</p>

    <img src="images/squares.JPG" alt="Screenshot of Project 1" width="500">

    <br><br>
    <a href="index.html">← Back to Home</a>
  </div>
</body>
</html>
