<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Repurposed 3D Printer Test </title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f9fa;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2rem;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .gallery img {
      width: 250px; /* Adjust width as needed */
      height: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: transform 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Repurposed 3D Printer</h1>
    <p>This is my first project. Below are images of it:</p>

    <div class="gallery">
      <img src="images/PrinterWithToolHead.JPG" alt="Project Image 1">
      <img src="images/PrinterNoToolHead.JPG" alt="Project Image 2">
      <img src="images/PrintedImage.JPG" alt="Project Image 3">
    </div>

    <a href="index.html">← Back to Home</a>
  </div>
</body>
</html>
